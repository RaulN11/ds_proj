server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s;   # Docker's internal DNS

  # Temporary stand-in for the gateway: same paths Traefik will expose later.
  location /auth/ {
    set $auth http://auth-service:8080;
    proxy_pass $auth;
  }
  location /users {
    set $users http://user-service:8080;
    proxy_pass $users;
  }
  location /devices {
    set $devices http://device-service:8080;
    proxy_pass $devices;
  }

  location / {
    try_files $uri /index.html;
  }
}
