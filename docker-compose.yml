services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"                     
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  user-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB1_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [user-db-data:/var/lib/postgresql/data]

  device-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB2_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [device-db-data:/var/lib/postgresql/data]

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB3_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [auth-db-data:/var/lib/postgresql/data]

  user-service:
    build: ./User-Management
    depends_on: [user-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${DB1_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      DEVICE_SERVICE_URL: http://device-service:8080
      AUTH_SERVICE_URL: http://auth-service:8080
    ports: ["8081:8080"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.users.rule=PathPrefix(`/users`)"
      - "traefik.http.routers.users.entrypoints=web"
      - "traefik.http.routers.users.middlewares=admin-auth"
      - "traefik.http.services.users.loadbalancer.server.port=8080"

  device-service:
    build: ./Device-Management
    depends_on: [device-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://device-db:5432/${DB2_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      USER_SERVICE_URL: http://user-service:8080
    ports: ["8082:8080"]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.devices.rule=PathPrefix(`/devices`)"
      - "traefik.http.routers.devices.entrypoints=web"
      - "traefik.http.routers.devices.middlewares=jwt-auth"
      - "traefik.http.services.devices.loadbalancer.server.port=8080"

  auth-service:
    build: ./Authentication
    depends_on: [auth-db]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/${DB3_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATIONTIMEMS: ${JWT_EXPIRATIONTIMEMS}
      USER_MANAGEMENT_URL: http://user-service:8080
    ports: ["8083:8080"]
    labels:
      - "traefik.enable=true"
      # middlewares: Traefik asks auth-service to validate the JWT before forwarding
      - "traefik.http.middlewares.jwt-auth.forwardauth.address=http://auth-service:8080/auth/validate"
      - "traefik.http.middlewares.jwt-auth.forwardauth.authResponseHeaders=X-User-Id,X-User-Name,X-User-Role"
      - "traefik.http.middlewares.admin-auth.forwardauth.address=http://auth-service:8080/auth/validate-admin"
      - "traefik.http.middlewares.admin-auth.forwardauth.authResponseHeaders=X-User-Id,X-User-Name,X-User-Role"
      # public routes: login and register only
      - "traefik.http.routers.auth.rule=Path(`/auth/login`) || Path(`/auth/register`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"

  frontend:
    build: ./frontend
    depends_on: [auth-service, user-service, device-service]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  user-db-data:
  device-db-data:
  auth-db-data: